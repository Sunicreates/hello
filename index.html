<!DOCTYPE html>
<html>
<head>
  <title>FBX Animation Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial;
      font-size: 18px;
      text-align: center;
    }
    #progress {
      width: 300px;
      margin-top: 20px;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
    #controls button {
      margin-right: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div>Loading 3D viewer...</div>
    <div id="status">Initializing</div>
    <progress id="progress" value="0" max="100"></progress>
  </div>

  <div id="controls">
    <button data-file="Chicken Dance.fbx">lets Dance</button>
    <button data-file="Laying.fbx">Good night ! I am going to Sleep</button>
    <button data-file="Jumping Down.fbx">I am jumping</button>
    <button data-file="Sitting Laughing.fbx">I made a joke</button>
  </div>

  <!-- Required libraries -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FBXLoader.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const progressEl = document.getElementById('progress');


    let scene, camera, renderer, mixer, fbxLoader, dirLight, clock;

    function updateStatus(msg, progress = null) {
      statusEl.textContent = msg;
      if (progress !== null) {
        progressEl.value = progress;
      }
      console.log(msg);
    }

    function loadModel(fileName) {
      updateStatus(`Loading ${fileName}...`, 30);
      

      fbxLoader.load(
        fileName,
        (object) => {
          if (mixer) mixer.stopAllAction();
          scene.clear();
          scene.add(new THREE.GridHelper(10, 10));
          scene.add(new THREE.AmbientLight(0x404040));
          dirLight.position.set(1, 1, 1);
          scene.add(dirLight);

          object.scale.set(0.5, 0.5, 0.5);
          object.position.set(0, 0, 0);
          scene.add(object);
          
          const yellowMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
    object.traverse(child => {
      if (child.isMesh) {
        child.material = yellowMaterial;
      }
    });

    scene.add(object);


          if (object.animations && object.animations.length > 0) {
            mixer = new THREE.AnimationMixer(object);
            const action = mixer.clipAction(object.animations[0]);
            action.play();

            updateStatus(`Playing ${fileName}`, 100);
            document.getElementById('loading').style.display = 'none';
          } else {
            updateStatus(`No animations found in ${fileName}`, 100);
          }
        },
        (xhr) => {
          if (xhr.total > 0) {
            const percent = (xhr.loaded / xhr.total) * 100;
            updateStatus(`Loading FBX: ${Math.round(percent)}%`, 30 + (percent * 0.5));
          }
        },
        (error) => {
          updateStatus(`ERROR loading ${fileName}: ${error.message}`, 100);
          console.error(error);
        }
      );
    }

    function init() {
      // Initialize core components
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff); // white
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      fbxLoader = new THREE.FBXLoader();
      dirLight = new THREE.DirectionalLight(0xffffff, 1);
      clock = new THREE.Clock();

      scene.add(new THREE.AmbientLight(0x404040));
      dirLight.position.set(1, 1, 1);
      scene.add(dirLight);
      scene.add(new THREE.GridHelper(10, 10));

      // Handle model switching via buttons
      document.querySelectorAll('#controls button').forEach(btn => {
        btn.addEventListener('click', () => {
          const file = btn.getAttribute('data-file');
          loadModel(file);
        });
      });

      // Load default model
      loadModel('Chicken Dance.fbx');

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        if (mixer) mixer.update(clock.getDelta());
        renderer.render(scene, camera);
      }
      animate();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
